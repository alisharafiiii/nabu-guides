<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <title>X Article cover mobile safe-area guide</title>
  <desc>Overlay this 5:2 guide on an X Article cover. Red areas can be covered by mobile interface controls. Green is the primary content-safe area.</desc>

  <rect width="1500" height="600" fill="none" stroke="#111" stroke-width="4"/>

  <!-- Mobile status-bar collision zone: top 18%. -->
  <rect x="0" y="0" width="1500" height="108" fill="#ef4444" fill-opacity="0.14"/>
  <path d="M0 108H1500" stroke="#ef4444" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- X mobile back and visibility controls. -->
  <rect x="0" y="108" width="195" height="240" rx="28" fill="#ef4444" fill-opacity="0.18"/>
  <rect x="1305" y="108" width="195" height="240" rx="28" fill="#ef4444" fill-opacity="0.18"/>
  <circle cx="86" cy="190" r="55" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="1414" cy="190" r="55" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Primary safe area: x 15–85%, y 20–82%. -->
  <rect x="225" y="120" width="1050" height="372" rx="24" fill="#22c55e" fill-opacity="0.06" stroke="#16a34a" stroke-width="4" stroke-dasharray="18 10"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="30" y="64" fill="#b91c1c" font-size="30">KEEP ESSENTIAL CONTENT OUT — MOBILE STATUS UI</text>
    <text x="750" y="306" text-anchor="middle" fill="#15803d" font-size="38">PRIMARY CONTENT SAFE AREA</text>
    <text x="86" y="278" text-anchor="middle" fill="#b91c1c" font-size="24">BACK</text>
    <text x="1414" y="278" text-anchor="middle" fill="#b91c1c" font-size="24">CONTROL</text>
    <text x="750" y="562" text-anchor="middle" fill="#111" font-size="24">1500 × 600 · 5:2 · X ARTICLE MOBILE GUIDE</text>
  </g>
</svg>
